<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>PWA Chat</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3cff8f">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Courier New", Courier, monospace; }
    body { 
          background: #0a0a0a; 
          color: #e8e8e8; 
          display: flex; 
          flex-direction: column; 
          min-height: 100vh;
          /* Extra padding at the bottom so the fixed input bar never overlaps the latest message */
          padding-bottom: 70px; 
        }
      
    header { background: #111; padding: 12px; text-align: center; border-bottom: 2px solid #3cff8f; display: flex; justify-content: space-between; align-items: center;}
    header h1 { color: #3cff8f; font-size: 18px; letter-spacing: 4px; font-weight: bold; }
    
    #auth-section { padding: 20px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;}
    #auth-section p { font-size: 13px; color: #888; margin-bottom: 15px; }
    #auth-section input { width: 85%; max-width: 320px; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #1a1a1a; color: #fff; font-family: inherit; }
    #auth-section input:focus { outline: none; border-color: #3cff8f; }
    
    button { background: #1e3320; color: #3cff8f; border: 1px solid #3cff8f; padding: 12px 24px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
    button:active { background: #3cff8f; color: #000; }
    
    #chat-section { 
          display: none; 
          flex: 1; 
          flex-direction: column; 
        }
    #chat-status { background: #111; padding: 5px 12px; font-size: 11px; color: #3cff8f; border-bottom: 1px solid #1e1e1e; text-align: right; }
    #messages { 
          flex: 1; 
          padding: 10px 8px; 
          /* Allow natural scrolling instead of a forced boundary wrapper */
          overflow-y: visible; 
        }
    
    .msg { margin-bottom: 10px; padding: 6px 8px; border-left: 2px solid #333; word-break: break-word; }
    .msg.mine { border-left-color: #3cff8f; background: #0d1f14; }
    .msg .meta { font-size: 10px; color: #555; margin-bottom: 3px; }
    .msg.mine .meta { color: #3cff8f; }
    .msg .text { font-size: 13px; color: #ddd; }
    .msg.mine .text { color: #f0f0f0; }

    .sys-msg { text-align: center; font-size: 10px; color: #444; margin: 6px 0; letter-spacing: 1px; }
    
    #input-bar { 
          position: fixed;
          bottom: 0;
          left: 0;
          width: 100%;
          background: #111; 
          padding: 8px; 
          border-top: 2px solid #1e1e1e; 
          z-index: 9999;
        }
    #input-bar table { width: 100%; border-collapse: collapse; }
    #msg-input { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #e8e8e8; font-family: inherit; font-size: 13px; padding: 6px 8px; resize: none; height: 36px; }
    #msg-input:focus { outline: none; border-color: #3cff8f; }
    #send-btn { width: 60px; height: 36px; background: #1e3320; border: 1px solid #3cff8f; color: #3cff8f; font-family: inherit; font-size: 12px; cursor: pointer; letter-spacing: 1px; }
    #send-btn:active { background: #3cff8f; color: #000; }
  </style>
</head>
<body>

  <header>
    <h1>[ CHAT ]</h1>
    <button id="notify-btn" style="display:none; padding: 6px 10px; font-size: 11px;">ALERTS</button>
  </header>

  <div id="auth-section">
    <p>SECURE ENTRY PROMPT</p>
    <input type="email" id="email" placeholder="ENTER EMAIL" autocomplete="off">
    <input type="password" id="password" placeholder="ENTER PASSWORD">
    <button id="login-btn">ACCESS ROOM</button>
    <p id="auth-error" style="color: #ff3c3c; margin-top: 15px; font-size: 11px;"></p>
  </div>

  <div id="chat-section">
    <div id="chat-status">LOADING...</div>
    <div id="messages"></div>
    <div id="input-bar">
      <table>
        <tr>
          <td>
            <textarea id="msg-input" placeholder="Type message..." maxlength="400"></textarea>
          </td>
          <td style="width:64px; padding-left:4px;">
            <button id="send-btn">SEND</button>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ================================================================
    // 1. PROJECT 2 CONFIG (Public Android PWA Access Guard)
    // ================================================================
    const project2Config = {
      const project2Config = {
      apiKey: "PASTE_YOUR_PROJECT_2_API_KEY_HERE",
      authDomain: "YOUR_PROJECT_2_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_2_ID"
    };
    const app2 = initializeApp(project2Config);
    const auth = getAuth(app2);

    // ================================================================
    // 2. PROJECT 1 CONFIG (Copy EXACTLY from your button phone code)
    // ================================================================
    var DB_URL  = "https://your-project-1-id-default-rtdb.asia-southeast1.firebasedatabase.app"; // No trailing slash
    var API_KEY = "YOUR_PROJECT_1_SECRET_OR_API_KEY";
    // ================================================================

    const authSection = document.getElementById('auth-section');
    const chatSection = document.getElementById('chat-section');
    const messagesDiv = document.getElementById('messages');
    const notifyBtn = document.getElementById('notify-btn');
    const statusEl = document.getElementById('chat-status');
    
    var MAX_MESSAGES = 200; // Matches button phone constraints
    var currentUser = null;
    var mySessionId = (Math.random() * 99999999 | 0).toString(); // Matches session definition
    var lastKnownKeys = {};
    var chatInterval = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // Status Helper matching phone interface styling
    function setStatus(txt) {
      statusEl.textContent = txt;
    }

    // Native XHR architecture ported over directly from button phone code
    function xhr(method, url, body, cb) {
      var req;
      try { req = new XMLHttpRequest(); }
      catch(e) { cb(null, "No XHR"); return; }
      
      req.open(method, url, true);
      if (body) req.setRequestHeader("Content-Type", "application/json");
      req.onreadystatechange = function() {
        if (req.readyState !== 4) return;
        if (req.status >= 200 && req.status < 300) {
          var d = null;
          try { d = JSON.parse(req.responseText); } catch(e) {}
          cb(d, null);
        } else {
          cb(null, "HTTP " + req.status);
        }
      };
      req.send(body || null);
    }

    // Formatting matching button phone layout rules
    function formatTime(ts) {
      if (!ts) return "";
      var d = new Date(ts);
      var h = d.getHours(), mn = d.getMinutes();
      return (h < 10 ? "0" : "") + h + ":" + (mn < 10 ? "0" : "") + mn;
    }

    // Process secure sign-in (Blocks registrations, checks console users list)
    document.getElementById('login-btn').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const errEl = document.getElementById('auth-error');
      errEl.innerText = ""; 

      if(!email || !pass) {
        errEl.innerText = "MISSING IDENTITY FIELD DATA.";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password') {
          errEl.innerText = "ACCESS DENIED: IDENTITY UNVERIFIED.";
        } else {
          errEl.innerText = "ERROR: " + e.message.toUpperCase();
        }
      }
    };

    // Tracking state loops
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.style.display = 'none';
        chatSection.style.display = 'flex';
        notifyBtn.style.display = 'block';
        
        // Setup initial loop conditions
        messagesDiv.innerHTML = '';
        lastKnownKeys = {};
        if(chatInterval) clearInterval(chatInterval);
        
        loadMessages(); // Direct execution
        chatInterval = setInterval(loadMessages, 3000); // 3-second cycle matching phone sync behaviors
      } else {
        authSection.style.display = 'flex';
        chatSection.style.display = 'none';
        if(chatInterval) clearInterval(chatInterval);
      }
    });

    // Mirroring loadMessages function architecture
    var maxSeenTs = 0;
    var myLastReportedTs = 0;

 function updateMyReadReceipt(latestTs) {
  if (!latestTs || latestTs <= myLastReportedTs) return;
  myLastReportedTs = latestTs;
  
  var safeId = currentUser ? currentUser.email.replace(/[\.\$#\[\]\/]/g, '_') : mySessionId;
  var url = DB_URL + "/chatroom/read_receipts.json?auth=" + API_KEY + "&X-HTTP-Method-Override=PATCH";
  var payload = {};
  payload[safeId] = latestTs;
  
  xhr("POST", url, JSON.stringify(payload), function(){});
}

function loadMessages() {
  // We only show the "LOADING..." status text on the very first boot
  if (Object.keys(lastKnownKeys).length === 0) {
    setStatus("LOADING...");
  }
  
  var url = DB_URL + "/chatroom/messages.json"
    + "?auth=" + API_KEY
    + "&orderBy=%22ts%22"
    + "&limitToLast=" + MAX_MESSAGES;

  xhr("GET", url, null, function(data, err) {
    if (err) {
      var url2 = DB_URL + "/chatroom/messages.json?auth=" + API_KEY;
      xhr("GET", url2, null, function(d2, e2) {
        if (e2) { setStatus("SYNC ERROR"); return; }
        fetchReceipts(d2);
      });
      return;
    }
    fetchReceipts(data);
  });
}

function fetchReceipts(msgData) {
  var url = DB_URL + "/chatroom/read_receipts.json?auth=" + API_KEY;
  xhr("GET", url, null, function(receiptsData, err) {
    renderAll(msgData, receiptsData || {});
  });
}

function renderAll(data, receipts) {
  if (!data) {
    if (!messagesDiv.querySelector(".sys-msg")) {
      messagesDiv.innerHTML = '<div class="sys-msg">-- no messages yet --</div>';
    }
    setStatus("0 messages");
    return;
  }

  var keys = Object.keys(data).sort(function(a, b) {
    return data[a].ts - data[b].ts;
  });

  if (keys.length > MAX_MESSAGES) {
    keys = keys.slice(keys.length - MAX_MESSAGES);
  }

  var mySafeEmail = currentUser ? currentUser.email.replace(/[\.\$#\[\]\/]/g, '_') : '';
  
  // Identify the highest timestamp acknowledged by the other user
  var maxOtherTs = 0;
  for (var k in receipts) {
    if (receipts.hasOwnProperty(k) && k !== mySafeEmail) {
      if (receipts[k] > maxOtherTs) maxOtherTs = receipts[k];
    }
  }

  // Determine if a genuinely new text arrived to handle auto-scrolling
  var hasNewMessages = false;
  var brandNewKeys = {};
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    if (!lastKnownKeys[key]) {
      brandNewKeys[key] = true;
      hasNewMessages = true;
    }
  }

  // Clear and paint the current message stack
  messagesDiv.innerHTML = "";
  var newKnownKeys = {};
  var latestTs = 0;

  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    newKnownKeys[key] = true;
    var m = data[key];
    if (m && m.ts > latestTs) latestTs = m.ts;
    
    appendMsg(messagesDiv, m, maxOtherTs, !!brandNewKeys[key]);
  }

  lastKnownKeys = newKnownKeys;
  setStatus("Connected -- Live Auto-Sync");

  // Keep scroll tied to bottom if a new message comes in
  if (hasNewMessages) {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // Broadcast your presence by updating your read receipt checkpoint
  if (latestTs && mySafeEmail) {
    var url = DB_URL + "/chatroom/read_receipts/" + mySafeEmail + ".json?auth=" + API_KEY;
    xhr("PUT", url, JSON.stringify(latestTs), function(){});
  }
}

function appendMsg(container, m, maxOtherTs, isNew) {
  if (!m || !m.text) return;
  var isMine = (m.sid === mySessionId || (currentUser && m.name === currentUser.email));

  var ph = container.querySelector(".sys-msg");
  if (ph) container.removeChild(ph);

  var div = document.createElement("div");
  div.className = "msg" + (isMine ? " mine" : "");

  var meta = document.createElement("div");
  meta.className = "meta";
  
  var shortSender = m.name ? m.name.split('@')[0] : "anon";
  
  // Status text wrapped neatly in a dedicated span class
  var statusTag = "";
  if (isMine) {
    if (maxOtherTs && m.ts <= maxOtherTs) {
      statusTag = '  <span class="status-tag" style="color: #3cff8f;">[SEEN]</span>';
    } else {
      statusTag = '  <span class="status-tag" style="color: #555;">[SENT]</span>';
    }
  }

  meta.innerHTML = shortSender + "  " + formatTime(m.ts) + statusTag;
  div.appendChild(meta);

  var txt = document.createElement("div");
  txt.className = "text";
  txt.textContent = m.text;
  div.appendChild(txt);

  container.appendChild(div);

  // Background Push Hook
  if (isNew && !isMine && document.hidden && Notification.permission === "granted") {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(`New message from ${shortSender}`, { body: m.text });
    });
  }
}

    // Send payload matching layout schemas
    document.getElementById('send-btn').onclick = sendMsg;
    document.getElementById('msg-input').onkeydown = function(e) {
      if (e.key === "Enter" || e.keyCode === 13) {
        if (!e.shiftKey) {
          e.preventDefault();
          sendMsg();
        }
      }
    };

    function sendMsg() {
      var msgEl = document.getElementById("msg-input");
      var text  = (msgEl.value || "").replace(/^\s+|\s+$/g, "");
      if (!text) return;

      setStatus("SENDING...");
      msgEl.value = "";

      var payload = JSON.stringify({
        name: currentUser.email,
        text: text.substr(0, 400),
        ts:   new Date().getTime(),
        sid:  mySessionId
      });

      var url = DB_URL + "/chatroom/messages.json?auth=" + API_KEY;
      xhr("POST", url, payload, function(data, err) {
        if (err) { setStatus("SEND FAILED: " + err); return; }
        
        // Instant interface painting loop tracking logic
        var m = { name: currentUser.email, text: text, ts: new Date().getTime(), sid: mySessionId };
        if (data && data.name) lastKnownKeys[data.name] = true;
        
        appendMsg(messagesDiv, m);
        var total = Object.keys(lastKnownKeys).length;
        setStatus(total + " messages -- message sent");
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    // Toggle Notifications Alert Prompt
    notifyBtn.onclick = async () => {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        notifyBtn.innerText = "ALERTS ON";
        notifyBtn.style.background = "#3cff8f";
        notifyBtn.style.color = "#000";
      } else {
        alert("Notifications rejected by device configuration.");
      }
    };
// Automatically sync messages and check seen/unseen statuses every 4 seconds
setInterval(loadMessages, 3000);
  </script>
</body>
</html>
